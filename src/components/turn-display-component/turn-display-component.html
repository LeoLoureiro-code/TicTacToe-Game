<div class="options_div">
    <div class="figures_div">
        <img src="assets/icon-x.svg" alt="cross icon" class="figure_img">
        <img src="assets/icon-o.svg" alt="circle icon" class="figure_img">
    </div>
    <div class="turn_div">
        <p class="turn-paragraph">{{turn}} Turn</p>
    </div>
    <button class="reset_button" (click)="ResetGame()"><img src="assets/icon-restart.svg" alt="restart icon" class="reset_img"></button>
</div>
