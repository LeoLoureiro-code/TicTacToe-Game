<div class="space_div">
    <button (click)="AddFigure()">
       @if (gameService.gameState.spaces[row][column] === 'X') {
        <img src="assets/icon-x.svg" alt="X">
    }

        @if (gameService.gameState.spaces[row][column] === 'O') {
            <img src="assets/icon-o.svg" alt="O">
        }
    </button>

</div>
