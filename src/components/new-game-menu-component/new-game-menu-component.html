<div class="new_game_div">
    <div class="figures_div">
        <img src="assets/icon-x.svg" alt="cross icon">
        <img src="assets/icon-o.svg" alt="circle icon">
    </div>
    <div class="options_div">
        <p class="options_paragraph">PICK PLAYER 1’S MARK</p>
        <div class="options_choose">
            <button id = "buttonX" class="option option_chosen" data-mark="X">
                <img src="assets/icon-x.svg" alt="cross icon" class="figure_image">
            </button>
            <button id="buttonY" class="option" data-mark="O">
                <img src="assets/icon-o.svg" alt="circle icon" class="figure_image">
            </button>
        </div>
        <p class="rule_paragraph">REMEMBER : X GOES FIRST</p>
    </div>
    <div class="game_options_div">
        <button 
            id="CpuButton" 
            class="game_option_button" 
            routerLink="/game"
            (click)="StartVsCpu()">
            >
            NEW GAME (VS CPU)
        </button>
        <button 
            id="PlayerButton" 
            class="game_option_button" 
            routerLink="/game"
            (click)="StartVsPlayer()">
            >
            NEW GAME  (VS PLAYER)
        </button>
    </div>
</div>
